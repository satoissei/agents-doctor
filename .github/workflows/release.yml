name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=agents_doctor
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: bandit -q -r src
      - name: Reject potential secrets in tracked files
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True, text=True
          ).stdout.split("\0")
          paths = [path for path in tracked if path]
          scan = subprocess.run(
              [sys.executable, "-m", "detect_secrets", "scan", "--no-verify", "--", *paths],
              check=True,
              capture_output=True,
              text=True,
          )
          findings = json.loads(scan.stdout)["results"]
          if findings:
              print(json.dumps(findings, indent=2))
              raise SystemExit("Potential secrets found in tracked files.")
          PY
      - name: Verify that the tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          ref_type = os.environ["RELEASE_REF_TYPE"]
          if ref_type != "tag":
              raise SystemExit(f"release must run from a tag, not {ref_type!r}")
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match project version {expected!r}")
          PY
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    # Publishing is opt-in: set the repository variable PUBLISH_TO_PYPI to "true"
    # once a PyPI project and trusted publisher are configured.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
