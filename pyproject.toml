[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agents-doctor"
version = "0.2.2"
description = "Show what an AI coding agent actually loads from your AGENTS.md files - including the parts silently truncated away."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "satoissei" }]
keywords = [
    "agents.md",
    "codex",
    "ai-agents",
    "linter",
    "monorepo",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ['tomli>=2.0; python_version < "3.11"']

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "detect-secrets>=1.5",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/satoissei/agents-doctor"
Documentation = "https://github.com/satoissei/agents-doctor#readme"
Source = "https://github.com/satoissei/agents-doctor"
Issues = "https://github.com/satoissei/agents-doctor/issues"
Changelog = "https://github.com/satoissei/agents-doctor/releases"
Security = "https://github.com/satoissei/agents-doctor/security/policy"

[project.scripts]
agents-doctor = "agents_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_doctor"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/CHANGELOG.md",
    "/GOVERNANCE.md",
    "/LICENSE",
    "/NOTICE",
    "/PRIVACY.md",
    "/requirements",
    "/SECURITY.md",
    "/SUPPORT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agents_doctor"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
files = ["src"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# tomli is only installed on Python < 3.11; on newer versions stdlib tomllib is used.
module = "tomli"
ignore_missing_imports = true

# agents-doctor checks itself in CI. See docs/configuration.md for all options.
[tool.agents-doctor]
max_bytes = 32768
